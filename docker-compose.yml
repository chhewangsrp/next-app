services:
  nginx:
    image: chhewangsrp/portfolio-nginx
    build:
      dockerfile: Dockerfile
      context: ./nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/ssl/certs
    ports:
      - "80:80"
      - "443:443"
  # Postgres
  database:
    image: chhewangsrp/portfolio-database
    build: ./db/
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      ALLOW_IP_RANGE: 0.0.0.0/0
    ports:
      - "5432:5432"

  # Django API development server
  api:
    image: chhewangsrp/portfolio-api
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    depends_on:
      - database
    env_file:
      - .env
    volumes:
      - ./api/src:/portfolio
    ports:
      - "8000:8000"
      - "5678:5678"

  # Node-based Next.js Webapp Development Server
  web:
    image: chhewangsrp/portfolio-web
    build:
      dockerfile: Dockerfile
      context: ./web/
    restart: unless-stopped
    command: npm run dev
    depends_on:
      - api
      - database
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./web/:/portfolio/
